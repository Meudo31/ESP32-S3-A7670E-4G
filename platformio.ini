; Firmware du module moto : Waveshare ESP32-S3 A7670E 4G
; Compiler + téléverser + moniteur :  pio run -t upload -t monitor
; Le firmware est aussi compilé automatiquement par GitHub Actions (.github/workflows/firmware.yml).

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = direct

lib_deps =
    adafruit/Adafruit MAX1704X @ ^1.0.3
    adafruit/Adafruit NeoPixel @ ^1.12.3
    bblanchon/ArduinoJson @ ^7.2.1

; ─── Carte 16 Mo de flash + PSRAM ───
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
; Deux partitions applicatives (app0 / app1) : indispensable pour la mise à jour par l'application.
board_build.partitions = default_16MB.csv
; ESP32-S3R8 (8 Mo de PSRAM octale, carte V2) : qio_opi.
; ESP32-S3R2 (2 Mo de PSRAM quad, carte V1 probable) : remplacer par qio_qspi.
board_build.arduino.memory_type = qio_opi

build_flags =
    ; Serial passe par le convertisseur CH343 (port USB-C, interrupteur DIP USB sur OFF).
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1
