[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps = 
    adafruit/Adafruit MAX1704X @ ^1.0.3
    adafruit/Adafruit NeoPixel @ ^1.12.3
    adafruit/Adafruit ADXL345 @ ^1.3.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    esphome/ESPAsyncWebServer-esphome @ ^3.2.2
    bodmer/TFT_eSPI @ ^2.5.43

# ─── CONFIGURATION DE LA DÉCLINAISON 16MB FLASH / 8MB OPI PSRAM ───
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi



# ─── SÉCURITÉ PARTITIONS ───
# La table standard "min_ota.csv" n'alloue que 1,2 Mo par partition.
# Puisque votre carte dispose de 16 Mo réels, on utilise une table beaucoup plus large !
board_build.partitions = default_16MB.csv


# Activation du support de la mémoire PSRAM externe de l'ESP32-S3 pour stocker les images JPEG de haute qualité
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_BT_ENABLED=1
    -D CONFIG_BT_BLUEDROID_ENABLED=1
    -D CONFIG_BT_SPP_ENABLED=1
    -D CONFIG_XTAL_FREQ_40=1



board_build.arduino.memory_type = qio_opi  # Configuration du type de mémoire pour le compilateur (Quad-SPI Flash + Octal-SPI PSRAM)
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
