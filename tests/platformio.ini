; Programmes de test de la carte Waveshare ESP32-S3 A7670E 4G, un par fonctionnalité.
; Chaque environnement compile un seul fichier de tests/src.
;   Compiler + téléverser + moniteur :  pio run -e test_carte -t upload -t monitor
; Les tests de ce dossier n'utilisent pas le modem (DIP 4G indifférent).

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; ESP32-S3R8 (8 Mo OPI). Pour une puce R2 : qio_qspi
board_build.arduino.memory_type = qio_opi
; Serial passe par le CH343 (port USB-C), comme dans "First Test"
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

[env:test_carte]
build_src_filter = +<test_carte.cpp>

[env:test_batterie]
build_src_filter = +<test_batterie.cpp>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit MAX1704X @ ^1.0.3

[env:test_sd]
build_src_filter = +<test_sd.cpp>

[env:test_heure]
build_src_filter = +<test_heure.cpp>

[env:test_modem_uart]
build_src_filter = +<test_modem_uart.cpp>
